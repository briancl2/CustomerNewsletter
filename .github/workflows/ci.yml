name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Closure identity
        env:
          CLOSURE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          CLOSURE_PHASE: ci-validation
          CLOSURE_TRIGGER: ${{ github.event_name }}
          EVIDENCE_REUSE_KEY: ${{ github.workflow }}:${{ github.ref }}:${{ github.sha }}
          PARENT_COMMAND: github-actions:ci
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 tools/emit_closure_identity.py --phase ci-validation --parent-command "github-actions:ci"

      - name: Structure validation
        run: make validate-structure

      - name: Skill validation (12 skills)
        run: make validate-all-skills

      - name: Newsletter validator self-test
        run: make test-validator

      - name: Phase 3 contract tests
        run: make test-phase3

      - name: Archive workspace tests
        run: make test-archive

      - name: Structural scoring (30pt)
        run: bash tools/score-structural.sh

      - name: Heuristic scoring (41pt)
        run: bash tools/score-heuristic.sh

      - name: Newsletter validation (all outputs)
        run: |
          for f in output/*.md; do
            echo "Validating: $f"
            make validate-newsletter FILE="$f"
          done

      - name: Benchmark regression (3 cycles)
        run: make test-benchmark

      - name: Intelligence sync check
        run: make check-intel-sync

      - name: Intelligence effectiveness test
        run: make test-intel-effectiveness

      - name: Polishing rules test
        run: make test-polishing

      - name: Full test suite summary
        if: always()
        run: |
          echo "=== Individual step results above ==="
          echo "All steps that passed are green in the Actions UI."
