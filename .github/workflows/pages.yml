name: Docs Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: pip install -r requirements.txt

      - name: Closure identity
        env:
          CLOSURE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          CLOSURE_PHASE: pages-build
          CLOSURE_TRIGGER: ${{ github.event_name }}
          EVIDENCE_REUSE_KEY: ${{ github.workflow }}:${{ github.ref }}:${{ github.sha }}
          PARENT_COMMAND: github-actions:pages-build
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 tools/emit_closure_identity.py --phase pages-build --parent-command "github-actions:pages-build"

      - name: Build docs
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
